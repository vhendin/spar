services:
  game:
    build: .
    ports:
      - "8080:8080"
    environment:
      REGION: valadalen
      # The game clock and weather belong to the server. Uncomment to change them:
      # START_TIME: "2026-08-15T09:00"   # in-game date and time the session starts at
      # DAY_LENGTH_MINUTES: "30"         # real minutes per in-game day; 0 stops the clock
      # WEATHER: rain                    # pin the weather to clear, overcast or rain
    volumes:
      - ./data/regions:/data/regions:ro
    restart: unless-stopped

  # Offline data import. Runs only on demand:
  #   docker compose run --rm importer build valadalen
  importer:
    build: ./importer
    profiles: ["tools"]
    environment:
      # Geotorget login for the 1 m elevation model; set them in .env (see .env.example).
      LANTMATERIET_USER: ${LANTMATERIET_USER:-}
      LANTMATERIET_PASSWORD: ${LANTMATERIET_PASSWORD:-}
    volumes:
      - ./data:/data
      - ./defs:/defs:ro
      - ./shared/schemas:/schemas:ro
      - ./importer:/app:ro
