<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spår</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f12; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 8px; left: 8px; padding: 6px 10px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e8eef0; background: rgba(0, 0, 0, 0.55); border-radius: 4px;
        white-space: pre; pointer-events: none; display: none;
      }
      #status {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        font: 17px/1.5 system-ui, sans-serif; color: #e8eef0; letter-spacing: 0.02em; pointer-events: none;
      }
      #hint {
        position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; padding: 6px 12px; border-radius: 4px; white-space: nowrap;
        font: 13px/1.4 system-ui, sans-serif; color: #e8eef0; background: rgba(6, 10, 12, 0.6);
        opacity: 0; transition: opacity 0.8s; pointer-events: none;
      }
      #hint kbd {
        padding: 1px 6px; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 3px; font: 12px ui-monospace, Menlo, monospace;
      }

      /* Instruments */
      #dash {
        position: fixed; right: 12px; bottom: 10px; width: min(360px, 46vw);
        pointer-events: none; user-select: none; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
      }
      #dash svg { display: block; width: 100%; height: auto; overflow: visible; }
      #dash .face { fill: rgba(8, 12, 14, 0.72); stroke: rgba(255, 255, 255, 0.18); stroke-width: 1.5; }
      #dash .tick { stroke: rgba(232, 238, 240, 0.55); stroke-width: 1.5; }
      #dash .tick.major { stroke: #e8eef0; stroke-width: 2.5; }
      #dash .num { fill: #e8eef0; font: 600 13px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
      #dash .redline { fill: none; stroke: #d0453a; stroke-width: 6; }
      #dash .needle { fill: #f08a24; }
      #dash .hub { fill: #2a3134; stroke: #f08a24; stroke-width: 2; }
      #dash .gear { fill: #e8eef0; font: 700 34px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
      #dash .gear.shifting { fill: #9fb4bc; }
      #dash .range { fill: #f0b429; font: 700 11px system-ui, sans-serif; text-anchor: middle; letter-spacing: 0.1em; }
      #dash .digits { fill: #e8eef0; font: 700 22px system-ui, sans-serif; text-anchor: middle; font-variant-numeric: tabular-nums; }
      #dash .unit { fill: #9fb4bc; font: 10px system-ui, sans-serif; text-anchor: middle; }
      #dash .lamps { display: flex; justify-content: center; gap: 6px; margin-top: 4px; }
      #dash .lamps span {
        padding: 2px 7px; border-radius: 3px; font: 700 11px/1.4 system-ui, sans-serif; letter-spacing: 0.06em;
        color: rgba(232, 238, 240, 0.3); background: rgba(8, 12, 14, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
      }
      #dash .lamps span.on { color: #111; background: #f0b429; border-color: #f0b429; }
      #dash .lamps span.brake.on { color: #fff; background: #c0392b; border-color: #c0392b; }
      #dash .winch {
        display: flex; align-items: center; gap: 8px; margin: 6px auto 0; width: 82%; padding: 3px 8px; border-radius: 3px;
        font: 700 11px/1.4 system-ui, sans-serif; letter-spacing: 0.06em; color: #e8eef0;
        background: rgba(8, 12, 14, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
      }
      #dash .winch .bar { flex: 1; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      #dash .winch .fill { height: 100%; width: 0; background: #f0b429; }
      #dash .winch.stall .fill { background: #d0453a; }
      #dash .winch .value { min-width: 78px; text-align: right; font-variant-numeric: tabular-nums; letter-spacing: 0; }
      #winch-help {
        position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; padding: 6px 12px; border-radius: 4px; white-space: nowrap;
        font: 13px/1.4 system-ui, sans-serif; color: #e8eef0; background: rgba(6, 10, 12, 0.6); pointer-events: none; display: none;
      }
      #winch-help kbd { padding: 1px 6px; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 3px; font: 12px ui-monospace, Menlo, monospace; }

      /* Menu */
      #menu {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10;
        background: rgba(6, 10, 12, 0.55); backdrop-filter: blur(3px);
        font: 14px/1.4 system-ui, sans-serif; color: #e8eef0;
      }
      #menu .box {
        width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box;
        padding: 22px 26px; background: rgba(10, 15, 18, 0.92); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px;
      }
      #menu h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: 0.02em; }
      #menu h2 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
      #menu h2:not(:first-child) { margin-top: 24px; }
      #menu .sub { margin: 0 0 16px; color: #9fb4bc; }
      #menu .list { display: flex; flex-direction: column; gap: 6px; }
      #menu .list button { padding: 10px 14px; font-size: 15px; text-align: left; }
      #menu .label { margin: 14px 0 5px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9fb4bc; }
      #menu .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      #menu .note { margin-left: 6px; color: #9fb4bc; font-size: 12px; }
      #menu button {
        padding: 5px 10px; font: inherit; color: #e8eef0; background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 4px; cursor: pointer;
      }
      #menu button:hover { background: rgba(255, 255, 255, 0.16); }
      #menu button.on, #menu button.primary { background: #c9a45c; border-color: #c9a45c; color: #111; }
      #menu button.primary:hover { background: #d8b673; }
      #menu button.link { padding: 0; background: none; border: none; color: #9fb4bc; text-decoration: underline; }
      #menu .foot { margin-top: 18px; }
      #menu .box:has(table.log) { width: min(640px, calc(100vw - 32px)); }
      #menu table.log { width: 100%; border-collapse: collapse; font-size: 13px; }
      #menu table.log th { text-align: left; font-weight: 600; color: #9fb4bc; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 6px 4px 0; }
      #menu table.log td { padding: 4px 6px 4px 0; border-top: 1px solid rgba(255, 255, 255, 0.08); vertical-align: top; }
      #menu table.log td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
      #menu table.log .best { color: #c9a45c; }
      #menu .back { margin-top: 16px; }
      #menu .row .back { margin-top: 0; }
      #menu p.hint { margin: 14px 0 12px; color: #9fb4bc; font-size: 12px; }
      #menu table.keys { border-collapse: collapse; width: 100%; margin-bottom: 4px; }
      #menu table.keys td { padding: 4px 0; vertical-align: top; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
      #menu table.keys td.key { width: 34%; padding-right: 10px; font: 12px/1.6 ui-monospace, Menlo, monospace; color: #c9a45c; white-space: nowrap; }
      #credits {
        position: fixed; inset: 0; display: none; z-index: 30; cursor: pointer; align-items: center; justify-content: center;
        background: rgba(6, 10, 12, 0.82); color: #e8eef0; font: 15px/1.6 system-ui, sans-serif;
      }
      #credits > div { max-width: 640px; padding: 28px 32px; }
      #credits h1 { margin: 0 0 4px; font-size: 26px; font-weight: 600; }
      #credits h2 { margin: 20px 0 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9fb4bc; }
      #credits ul { margin: 0; padding-left: 18px; }
      #credits p.hint { margin-top: 22px; color: #9fb4bc; font-size: 13px; }
      #world {
        position: fixed; bottom: 8px; right: 8px; display: none; width: 340px; z-index: 20; padding: 12px 16px 6px;
        font: 13px/1.4 system-ui, sans-serif; color: #e8eef0; background: rgba(6, 10, 12, 0.82); border-radius: 6px;
      }
      #world h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
      #world .label { margin: 10px 0 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9fb4bc; }
      #world .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      #world input[type=range] { flex: 1; accent-color: #c9a45c; }
      #world .value { width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
      #world button {
        padding: 4px 8px; font: inherit; color: #e8eef0; background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 4px; cursor: pointer;
      }
      #world button:hover { background: rgba(255, 255, 255, 0.16); }
      #world button.on { background: #c9a45c; border-color: #c9a45c; color: #111; }
      #world button.on.dim { background: rgba(201, 164, 92, 0.35); color: #e8eef0; }
      #world p.hint { margin: 10px 0 6px; color: #9fb4bc; font-size: 12px; }
      #prompt {
        position: fixed; left: 50%; top: 62%; transform: translateX(-50%); padding: 8px 16px; border-radius: 6px;
        font: 600 15px/1.4 system-ui, sans-serif; color: #e8eef0; background: rgba(6, 10, 12, 0.7);
        opacity: 0; transition: opacity 0.4s; pointer-events: none; white-space: nowrap;
      }
      #prompt kbd { padding: 1px 7px; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 3px; font: 13px ui-monospace, Menlo, monospace; }

      /* Start screen */
      #start {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 12;
        background: linear-gradient(90deg, rgba(6, 10, 12, 0.55), rgba(6, 10, 12, 0.15));
        font: 14px/1.4 system-ui, sans-serif; color: #e8eef0;
      }
      #start .box {
        width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box;
        padding: 26px 30px; background: rgba(10, 15, 18, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
      }
      #start h1 { margin: 0; font-size: 38px; font-weight: 600; letter-spacing: 0.02em; }
      #start .sub { margin: 2px 0 18px; color: #9fb4bc; }
      #start .columns { display: flex; flex-wrap: wrap; gap: 26px; }
      #start .column { flex: 1 1 260px; min-width: 0; }
      #start .label { margin: 14px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9fb4bc; }
      #start .column > .label:first-child { margin-top: 0; }
      #start .list { display: flex; flex-wrap: wrap; gap: 4px; }
      #start .cards { display: flex; flex-direction: column; gap: 6px; }
      #start .card {
        display: block; width: 100%; padding: 8px 12px; text-align: left; font: inherit; color: #e8eef0; box-sizing: border-box;
        background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 6px; cursor: pointer;
      }
      #start .card.on { border-color: #c9a45c; background: rgba(201, 164, 92, 0.16); }
      #start .card .title { font-weight: 600; }
      #start .card .detail { color: #9fb4bc; font-size: 12px; }
      #start .card { position: relative; }
      #start .card .remove { position: absolute; top: 8px; right: 10px; font-size: 12px; color: #9fb4bc; text-decoration: underline; cursor: pointer; }
      #start .card .remove:hover { color: #e8a090; }
      #start button.add { margin-top: 6px; }
      #areas {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 13;
        background: rgba(6, 10, 12, 0.6); font: 14px/1.4 system-ui, sans-serif; color: #e8eef0;
      }
      #areas .box {
        display: flex; flex-direction: column; width: min(1100px, calc(100vw - 32px)); height: min(720px, calc(100vh - 32px));
        box-sizing: border-box; padding: 20px 24px; background: rgba(10, 15, 18, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
      }
      #areas h2 { margin: 0 0 12px; font-size: 22px; font-weight: 600; }
      #areas .body { flex: 1; display: flex; gap: 18px; min-height: 0; }
      #areas .map { flex: 1; min-width: 0; border-radius: 6px; }
      #areas .side { width: 280px; display: flex; flex-direction: column; overflow-y: auto; }
      #areas .hint, #areas .note { margin: 0 0 8px; color: #9fb4bc; }
      #areas .label { margin: 12px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9fb4bc; }
      #areas .list { display: flex; flex-wrap: wrap; gap: 4px; }
      #areas input.name {
        width: 100%; box-sizing: border-box; padding: 7px 10px; font: inherit; color: #e8eef0;
        background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 4px;
      }
      #areas .note { margin-top: 12px; }
      #areas pre.progress {
        margin: 0 0 8px; padding: 8px; max-height: 160px; overflow: auto; white-space: pre-wrap; font: 11px/1.35 ui-monospace, monospace;
        color: #c8d4d8; background: rgba(255, 255, 255, 0.05); border-radius: 4px;
      }
      #areas .foot { display: flex; gap: 8px; margin-top: auto; padding-top: 12px; }
      #areas button {
        padding: 6px 14px; font: inherit; color: #e8eef0; cursor: pointer;
        background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 4px;
      }
      #areas button:hover { background: rgba(255, 255, 255, 0.16); }
      #areas button.on { background: #c9a45c; border-color: #c9a45c; color: #111; }
      #areas button.primary { font-weight: 600; background: #c9a45c; border-color: #c9a45c; color: #111; }
      #areas button:disabled { opacity: 0.5; cursor: default; }
      #areas .leaflet-container { font: 12px system-ui, sans-serif; background: #2a3236; }
      @media (max-width: 700px) {
        #areas .body { flex-direction: column; }
        #areas .side { width: auto; }
        #areas .map { min-height: 260px; }
      }
      #start canvas.preview { display: block; width: 240px; height: 240px; max-width: 100%; margin-top: 8px; border-radius: 6px; }
      #start input.name {
        width: 100%; box-sizing: border-box; padding: 7px 10px; font: inherit; color: #e8eef0;
        background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 4px;
      }
      #start .foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 22px; }
      #start button:not(.card) {
        padding: 6px 12px; font: inherit; color: #e8eef0; background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 4px; cursor: pointer;
      }
      #start button:not(.card):hover, #start .card:hover { background: rgba(255, 255, 255, 0.16); }
      #start button.on:not(.card) { background: #c9a45c; border-color: #c9a45c; color: #111; }
      #start button.primary { padding: 9px 26px; font-size: 16px; font-weight: 600; background: #c9a45c; border-color: #c9a45c; color: #111; }
      #start button.primary:hover { background: #d8b673; }
      #start button.link-button { background: none; border-style: dashed; color: #9fb4bc; }
      #start button.link { padding: 0; margin-left: auto; background: none; border: none; color: #9fb4bc; text-decoration: underline; }

      /* Map */
      #map { position: fixed; inset: 0; display: none; z-index: 15; font: 14px/1.4 system-ui, sans-serif; color: #e8eef0; }
      #map canvas { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
      #map .readout {
        position: absolute; left: 12px; top: 10px; padding: 3px 8px; border-radius: 4px; pointer-events: none;
        font: 12px ui-monospace, Menlo, monospace; color: #222; background: rgba(255, 255, 255, 0.8);
      }
      #map .readout:empty { display: none; }
      #map .side {
        position: absolute; top: 0; right: 0; bottom: 0; width: 320px; box-sizing: border-box; overflow-y: auto;
        padding: 18px 20px; background: rgba(10, 15, 18, 0.92); border-left: 1px solid rgba(255, 255, 255, 0.1);
      }
      #map h2 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
      #map .label { margin: 16px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9fb4bc; }
      #map .sublabel { margin: 8px 0 4px; font-size: 12px; color: #c8d4d8; }
      #map .dest { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
      #map .dest .name { font-weight: 600; color: #f0a070; }
      #map .dest .none { color: #9fb4bc; font-size: 13px; }
      #map .dest .distance { color: #9fb4bc; font-variant-numeric: tabular-nums; }
      #map .list { display: flex; flex-wrap: wrap; gap: 4px; }
      #map .spawn { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 2px 0; }
      #map .foot { display: flex; gap: 6px; margin-top: 18px; }
      #map p.hint { margin: 12px 0 0; color: #9fb4bc; font-size: 12px; }
      #map button {
        padding: 4px 9px; font: inherit; font-size: 13px; color: #e8eef0; background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 4px; cursor: pointer;
      }
      #map button:hover { background: rgba(255, 255, 255, 0.16); }
      #map button.on { background: #c9a45c; border-color: #c9a45c; color: #111; }
      #map button.link { padding: 0 2px; background: none; border: none; color: #9fb4bc; text-decoration: underline; }
      #map .spawn { gap: 6px; }
      #map input.start-name {
        flex: 1; min-width: 0; padding: 3px 6px; font: inherit; font-size: 13px; color: #e8eef0;
        background: rgba(44, 111, 176, 0.25); border: 1px solid rgba(44, 111, 176, 0.6); border-radius: 4px;
      }
      #minimap {
        position: fixed; left: 16px; bottom: 16px; width: min(190px, 30vw); height: min(190px, 30vw); display: none; z-index: 5;
        border-radius: 50%; pointer-events: none; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
        transition: width 0.15s ease-out, height 0.15s ease-out;
      }
      #minimap.big { width: min(620px, 80vh, 80vw); height: min(620px, 80vh, 80vw); }
      #guide {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 10px;
        padding: 5px 14px 5px 10px; border-radius: 18px; pointer-events: none;
        font: 600 14px/1.4 system-ui, sans-serif; color: #e8eef0; background: rgba(6, 10, 12, 0.6);
      }
      #guide .arrow { display: inline-flex; width: 20px; height: 20px; }
      #fatal {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        padding: 24px; font: 16px/1.5 system-ui, sans-serif; color: #e8eef0; text-align: center; white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="status"></div>
    <div id="hint"><kbd>Esc</kbd> menu and pause · <kbd>M</kbd> map · <kbd>N</kbd> minimap (hold <kbd>Tab</kbd> for a big one) · <kbd>T</kbd> time and weather · <kbd>V</kbd> camera</div>
    <div id="menu"></div>
    <div id="credits"></div>
    <div id="world"></div>
    <div id="fatal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
