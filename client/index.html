<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spår</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f12; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 8px; left: 8px; padding: 6px 10px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e8eef0; background: rgba(0, 0, 0, 0.55); border-radius: 4px;
        white-space: pre; pointer-events: none;
      }
      #fatal {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        padding: 24px; font: 16px/1.5 system-ui, sans-serif; color: #e8eef0; text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="fatal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
